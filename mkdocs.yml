# MkDocs site configuration — internal navigation for the pandas-ai dev workspace.
#
# This site is a *quick navigator* for the internal engineering docs and run
# artifacts. It deliberately does NOT include the Mintlify v2/v3 content
# (those are authored as .mdx and served by Mintlify — see docs/mint.json).
#
# Build:   make docs
# Serve:   .venv-docs/bin/mkdocs serve

site_name: PandasAI — Internal Dev Docs
site_description: Internal engineering docs & run-artifact navigator for the pandas-ai chat-excel-server workspace.
repo_url: https://github.com/sinaptik-ai/pandas-ai
edit_uri: ""

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: date

# Self-contained folders referenced directly from the audit/run-artifacts pages.
# Excluded so MkDocs doesn't try to index every cross-linked .md inside them.
exclude_docs: |
  audit-2025-05-07-v3.0.0-fixes/*
  planning/*

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
  nav:
    omitted_files: warn

nav:
  - Home: index.md
  - Architecture:
      - architecture/index.md
      - Vertical Slice & Server: architecture/server.md
      - Code Generation Pipeline: architecture/codegen-pipeline.md
      - Concurrent Registration: architecture/concurrent-registration-logic-map.md
  - Error Analysis & Root Cause:
      - error-analysis/index.md
      - Root-Cause Register: error-analysis/root-cause-register.md
      - Codegen Error Root Cause: error-analysis/codegen-error-rootcause.md
      - Code Smell Detection: error-analysis/code-smell-detection.md
      - Retry Thinking-Trace Analysis: error-analysis/retry-thinking-trace-analysis.md
      - Structural Validator Impact: error-analysis/structural-validator-impact.md
      - Thinking Trace (per-attempt): error-analysis/thinking-trace-per-attempt.md
  - Column Selection:
      - column-selection/index.md
      - Blocked Analysis: column-selection/blocked-analysis.md
      - DuckDB Search Options: column-selection/duckdb-search-options.md
  - Audits & Fixes:
      - audit/index.md
      - Audit 2025-05-07 fixes: audit/audit-2025-05-07.md
  - Setup & API:
      - setup-and-api-reference.md
      - MkDocs Setup: mkdocs-setup.md
  - Run Artifacts:
      - run-artifacts/index.md